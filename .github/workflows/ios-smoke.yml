# Phase 128 — iOS native smoke on a GitHub-hosted macOS runner (manual trigger).
# The hosted macos-15 image ships Xcode, iPhone simulators, Node 22 and Maven.
# Hand-written for the public sample; the recipe is documented in
# apps/demo-shop/ios/README.md of every generated project with an ios layer.
name: ios-smoke

on:
  workflow_dispatch:

jobs:
  ios-smoke:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Appium + XCUITest driver
        run: npm i -g appium && appium driver install xcuitest && appium driver list --installed
      - name: Boot an iPhone 16 simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name == "iPhone 16")][0].udid')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Download the official sample app (UIKitCatalog)
        run: bash scripts/download-ios-sample.sh
      - name: Start Appium
        run: |
          (appium --log-level info > appium.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:4723/status >/dev/null && break; sleep 2; done
          curl -sf localhost:4723/status
      - name: Warm up WebDriverAgent (first session builds it; no client timeout here)
        run: |
          SID=$(curl -sS -X POST localhost:4723/session -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"platformName":"iOS","appium:automationName":"XCUITest","appium:udid":"${{ steps.sim.outputs.udid }}","appium:app":"${{ github.workspace }}/.qaff/samples/UIKitCatalog-iphonesimulator.zip"}}}' | jq -r '.value.sessionId // empty')
          test -n "$SID" || { echo "warm-up session failed"; tail -50 appium.log; exit 1; }
          curl -sS -X DELETE "localhost:4723/session/$SID" >/dev/null
      - name: Run the iOS smoke
        run: bash scripts/run-ios-smoke.sh
        env:
          QAFF_APPIUM_UDID: ${{ steps.sim.outputs.udid }}
          QAFF_APPIUM_APP: ${{ github.workspace }}/.qaff/samples/UIKitCatalog-iphonesimulator.zip
          QAFF_SMOKE_ACCESSIBILITY_ID: Buttons
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-smoke-logs
          path: |
            appium.log
            apps/demo-shop/ios/target/allure-results/
            apps/demo-shop/ios/target/surefire-reports/
