# Appium configuration for the demo-shop ios module (iOS, XCUITest).
# Every key can be overridden with -D<key> or the QAFF_<KEY> environment
# variable (e.g. QAFF_APPIUM_APP, QAFF_APPIUM_UDID, QAFF_SMOKE_ACCESSIBILITY_ID).
appium.serverUrl=http://localhost:4723
appium.platformName=iOS
appium.automationName=XCUITest
# Simulator device type (see: xcrun simctl list devices) or the device name.
appium.deviceName=iPhone 16
# iOS runtime version (optional; blank = the driver picks a runtime for deviceName).
appium.platformVersion=
# Simulator / device UDID (optional; pins one of several).
appium.udid=
# Path to the .app bundle or a .zip of it (simulator build; relative paths
# resolve against the module directory Maven runs in). Leave blank and set
# bundleId to launch an app that is already installed.
appium.app=
appium.bundleId=
appium.newCommandTimeoutSeconds=120
# Accessibility id (accessibilityIdentifier / name) the smoke waits for on the
# first screen. Blank = the smoke only checks that a session starts.
smoke.accessibilityId=
smoke.timeoutSeconds=30
